name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is mid-flight: an interrupted
# deployment can leave the live site on a half-published bundle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Pages serves a project site from /<repo>/, so the bundle's asset URLs
        # need that prefix. vite.config.ts reads it from BASE_PATH.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
