name: Tag Codex for review

# Posts an "@codex review" comment on every pull request, so the Codex GitHub
# App (if installed on this repo) picks it up and runs an automatic review.
# This workflow only asks for the review; it does no reviewing itself and
# needs no model credentials.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag-codex:
    name: Request Codex review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment @codex review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@codex review',
            });
